name: CI

# 모든 브랜치에서 돌고, 바뀐 곳만 확인한다.
#   server/                         → 서버 타입체크·빌드·병합 단위 테스트·스모크 테스트(가계부 50 + 메모 43단계)
#   apps/budget/, packages/         → 한지붕 가계부
#   apps/memo/, packages/           → 한지붕 메모
#   e2e/, scripts/, 워크플로 파일     → 전부
# 결과(로그·스크린샷)는 ci-results 브랜치에 모인다. 수동 실행(workflow_dispatch)은 전부 확인한다.
on:
  push:
    branches: ['**', '!ci-results', '!deploy-results']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server == 'true' || steps.filter.outputs.all == 'true' }}
      budget: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.budget == 'true' || steps.filter.outputs.all == 'true' }}
      memo: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.memo == 'true' || steps.filter.outputs.all == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            budget:
              - 'apps/budget/**'
              - 'packages/**'
            memo:
              - 'apps/memo/**'
              - 'packages/**'
            all:
              - 'e2e/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/app.yml'

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p ci-out/server

      - name: Typecheck, build, unit tests
        id: build
        continue-on-error: true
        working-directory: server
        run: |
          set -o pipefail
          { npm ci && npm run typecheck && npm run build && npm run test:unit && npm run db:migrate:local; } 2>&1 | tee ../ci-out/server/build.log

      - name: Start API (wrangler dev)
        working-directory: server
        run: |
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 > ../ci-out/server/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/health && break; sleep 1; done

      - name: Smoke tests (가계부 + 메모)
        id: smoke
        continue-on-error: true
        working-directory: server
        run: |
          set -o pipefail
          # 운영과 같은 경로(/onehouse/budget, /onehouse/memo)로 확인한다
          {
            BASE=http://127.0.0.1:8787/onehouse/budget node test/smoke.mjs &&
            BASE=http://127.0.0.1:8787/onehouse/memo node test/memo-smoke.mjs
          } 2>&1 | tee ../ci-out/server/smoke.log

      - name: Summary
        if: always()
        run: |
          cat > ci-out/server/summary.md <<EOF
          ## 서버

          | 단계 | 결과 |
          | --- | --- |
          | 타입체크·빌드·병합 단위 테스트 | ${{ steps.build.outcome }} |
          | 스모크 테스트 (가계부 + 메모) | ${{ steps.smoke.outcome }} |
          EOF

      - uses: actions/upload-artifact@v4
        # 아티팩트 저장 용량이 차도 빌드·업로드는 계속 (결과물은 release-files 브랜치·스토어에 있음)
        continue-on-error: true
        if: always()
        with:
          name: ci-server
          path: ci-out/server
          retention-days: 3

      - name: Fail if any check failed
        if: always()
        run: |
          [ "${{ steps.build.outcome }}" = "success" ] && [ "${{ steps.smoke.outcome }}" = "success" ]

  budget:
    needs: changes
    if: needs.changes.outputs.budget == 'true'
    uses: ./.github/workflows/app.yml
    with:
      app: budget
      label: 한지붕 가계부

  memo:
    needs: changes
    if: needs.changes.outputs.memo == 'true'
    uses: ./.github/workflows/app.yml
    with:
      app: memo
      label: 한지붕 메모

  # ── 결과를 ci-results 브랜치로 (로그·스크린샷)
  report:
    needs: [changes, server, budget, memo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-*
          path: ci-out
      - name: Publish results to ci-results branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out
          cd ci-out
          for d in ci-*; do [ -d "$d" ] && mv "$d" "${d#ci-}"; done
          {
            echo "# CI ${GITHUB_SHA} (${GITHUB_REF_NAME})"
            echo
            echo "| 작업 | 결과 |"
            echo "| --- | --- |"
            echo "| 서버 | ${{ needs.server.result }} |"
            echo "| 한지붕 가계부 | ${{ needs.budget.result }} |"
            echo "| 한지붕 메모 | ${{ needs.memo.result }} |"
            echo
            echo "skipped = 이번 변경과 상관없어서 건너뜀"
            for d in server budget memo; do
              [ -f "$d/summary.md" ] && { echo; cat "$d/summary.md"; }
            done
          } > summary.md
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
      - name: Fail if any job failed
        run: |
          for r in "${{ needs.server.result }}" "${{ needs.budget.result }}" "${{ needs.memo.result }}"; do
            if [ "$r" = "failure" ]; then exit 1; fi
          done
