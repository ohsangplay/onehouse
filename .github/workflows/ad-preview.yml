name: 광고 미리보기 (Android 에뮬레이터)

# Android 에뮬레이터에 앱을 설치해 하단 배너(Google 테스트 광고)가 실제로 나온 화면을 찍고,
# store-assets/<앱>/ad-preview/에 커밋한다. 스토어 스크린샷이 아니라 배치 확인용.
on:
  workflow_dispatch:
  push:
    branches: [ad-preview]

permissions:
  contents: write

concurrency:
  group: ad-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 디스크 비우기 (Flutter + Android SDK + 에뮬레이터 이미지가 커서)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/heroku /opt/az /opt/microsoft || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: KVM 켜기 (에뮬레이터 가속)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 로컬 API (에뮬레이터에서는 10.0.2.2:8787)
        working-directory: server
        run: |
          npm ci
          npm run db:migrate:local
          nohup npx wrangler dev --port 8787 --ip 0.0.0.0 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/health && break; sleep 1; done

      - name: 앱 빌드 (테스트 광고, 로컬 서버)
        run: |
          bash scripts/flutter_platforms.sh apps/memo memo "한지붕 메모" android
          cd apps/memo
          # 로컬 http 서버에 붙으려고 평문 통신 허용 (미리보기 빌드에서만)
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          flutter build apk --release --dart-define=API_BASE_URL=http://10.0.2.2:8787

      - name: 에뮬레이터에서 촬영
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apps/memo/build/app/outputs/flutter-apk/app-release.apk
            OUT=$GITHUB_WORKSPACE/store-assets/memo/ad-preview bash e2e/ad-preview-android.sh || echo "촬영 실패" > $GITHUB_WORKSPACE/store-assets/memo/ad-preview/FAILED

      - name: 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p store-assets/memo/ad-preview
          df -h / | tail -1 > store-assets/memo/ad-preview/disk.txt
          git add -A -f store-assets/memo/ad-preview
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else
            git commit -m "광고 미리보기: 한지붕 메모 캡처"
            git pull --rebase --autostash
            git push
          fi
          [ ! -f store-assets/memo/ad-preview/FAILED ]
