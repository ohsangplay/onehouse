name: Android 빌드 (Play 스토어용 AAB)

# Google Play에 올릴 .aab 파일을 만든다. Actions 탭 → "Android 빌드 (Play 스토어용 AAB)" → Run workflow → 앱(memo / budget) 고르고 실행.
# 끝나면 실행 화면 아래 Artifacts의 "<앱>-aab"를 내려받아 Play Console에 올린다.
# 업로드 키는 앱마다 따로 만들어도 되고 같은 키를 써도 된다 (Secrets는 저장소에 하나).
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions)
#   ANDROID_KEYSTORE_BASE64    업로드 키(upload-keystore.jks)를 base64로 바꾼 값
#   ANDROID_KEYSTORE_PASSWORD  키스토어 비밀번호
#   ANDROID_KEY_ALIAS          키 별칭 (예: upload)
#   ANDROID_KEY_PASSWORD       키 비밀번호 (키스토어 비밀번호와 같게 만들었으면 같은 값)
# Secrets가 없으면 디버그 키로 서명한 확인용 파일만 만든다 (Play에는 못 올림).
#
# Play Console 자동 업로드 (선택)
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play Android Developer API 서비스 계정 키(JSON 파일 내용 그대로)
#   play_track 을 internal(내부 테스트) / alpha(비공개 테스트)로 고르면 빌드한 AAB를 그 트랙에 "초안"으로 올린다.
#   올린 뒤 Play Console에서 출시 노트를 확인하고 "검토를 위해 전송"만 누르면 된다.
#   주의: 앱의 맨 처음 AAB는 Google 정책상 Play Console에서 직접 한 번 올려야 한다 (그 뒤부터 자동 업로드 가능).
#
# 광고(AdMob) — 저장소 Variables (Settings → Secrets and variables → Actions → Variables 탭)
#   가계부: BUDGET_ADMOB_APP_ID_ANDROID, BUDGET_ADMOB_BANNER_ANDROID
#   메모:   MEMO_ADMOB_APP_ID_ANDROID,   MEMO_ADMOB_BANNER_ANDROID
#   (앱 ID는 ca-app-pub-xxxx~yyyy, 배너 광고 단위 ID는 ca-app-pub-xxxx/zzzz)
# 없으면 Google 테스트 광고로 빌드하고, Play 업로드는 막는다 (직접 올릴 AAB에도 테스트 광고가 들어 있으니 주의).

on:
  workflow_dispatch:
    inputs:
      app:
        description: "앱"
        type: choice
        options: [memo, budget]
        default: memo
      play_track:
        description: "Play Console에 업로드 (none = 빌드만, internal = 내부 테스트, alpha = 비공개 테스트)"
        type: choice
        options: [none, internal, alpha]
        default: none

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    env:
      ADMOB_APP_ID_ANDROID: ${{ inputs.app == 'budget' && vars.BUDGET_ADMOB_APP_ID_ANDROID || inputs.app == 'memo' && vars.MEMO_ADMOB_APP_ID_ANDROID || '' }}
      ADMOB_BANNER_ANDROID: ${{ inputs.app == 'budget' && vars.BUDGET_ADMOB_BANNER_ANDROID || inputs.app == 'memo' && vars.MEMO_ADMOB_BANNER_ANDROID || '' }}
      ADMOB_VAR_PREFIX: ${{ inputs.app == 'memo' && 'MEMO' || 'BUDGET' }}
    steps:
      - uses: actions/checkout@v5

      - name: AdMob ID 확인
        working-directory: .
        run: |
          if [ -n "$ADMOB_APP_ID_ANDROID" ] && [ -n "$ADMOB_BANNER_ANDROID" ]; then echo "AdMob: 실제 ID"; exit 0; fi
          if [ "${{ inputs.play_track }}" != none ]; then
            echo "::error title=AdMob ID 없음::저장소 Variables에 ${ADMOB_VAR_PREFIX}_ADMOB_APP_ID_ANDROID, ${ADMOB_VAR_PREFIX}_ADMOB_BANNER_ANDROID를 넣어야 Play에 올릴 수 있어요 (테스트 광고로 출시 방지)."
            exit 1
          fi
          echo "::warning title=테스트 광고::AdMob ID가 없어 Google 테스트 광고로 빌드해요. 이 AAB는 스토어에 올리지 마세요."

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 앱 고르기
        id: app
        working-directory: .
        run: |
          case "${{ inputs.app }}" in
            memo)   echo "label=한지붕 메모" >> "$GITHUB_OUTPUT" ;;
            budget) echo "label=한지붕 가계부" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::알 수 없는 앱: ${{ inputs.app }}"; exit 1 ;;
          esac

      - name: 플랫폼 폴더 생성·설정 (번들 ID, 이름, 아이콘, 서명)
        working-directory: .
        run: bash scripts/flutter_platforms.sh "apps/${{ inputs.app }}" "${{ inputs.app }}" "${{ steps.app.outputs.label }}"

      - name: 공통 패키지 테스트
        working-directory: packages/onehouse_core
        run: flutter pub get && flutter test

      - name: 테스트
        run: flutter test

      - name: 업로드 키 준비
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning title=업로드 키 없음::ANDROID_KEYSTORE_BASE64 Secret이 없어 디버그 키로 서명해요. 이 파일은 Play Console에 올릴 수 없어요."
            exit 0
          fi
          missing=""
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then echo "::error title=Secrets 부족::$missing"; exit 1; fi
          ks="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > "$ks"
          if ! keytool -list -keystore "$ks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=업로드 키 확인 실패::키스토어를 열지 못했어요. base64 값, 비밀번호, 별칭을 확인해 주세요."
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$ks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
          } >> "$GITHUB_ENV"
          echo "::notice title=업로드 키::업로드 키로 서명해요 ($KEY_ALIAS)"

      - name: AAB 빌드
        run: |
          set -o pipefail
          defines=()
          [ -n "$ADMOB_BANNER_ANDROID" ] && defines+=("--dart-define=ADMOB_BANNER_ANDROID=$ADMOB_BANNER_ANDROID")
          if ! flutter build appbundle --release --build-number=${{ github.run_number }} "${defines[@]}" 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            msg=$(grep -iE "error|failed|exception" "$RUNNER_TEMP/build.log" | tail -15 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=AAB 빌드 실패::$msg"
            exit 1
          fi
          sdk=$(grep -rhoE "targetSdk(Version)?\s*(:|=)\s*[0-9]+|val targetSdkVersion: Int = [0-9]+" "$FLUTTER_ROOT/packages/flutter_tools/gradle" 2>/dev/null | grep -oE "[0-9]+$" | head -1)
          ver=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "::notice title=AAB 완료::버전 $ver (버전 코드 ${{ github.run_number }}), targetSdk ${sdk:-확인 못 함}, $(flutter --version | head -1)"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.app }}-aab
          path: apps/${{ inputs.app }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Play 업로드 준비 확인
        id: play
        if: ${{ inputs.play_track != 'none' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error title=Play 업로드 불가::PLAY_SERVICE_ACCOUNT_JSON Secret이 없어요. AAB는 Artifacts에서 내려받아 직접 올릴 수 있어요."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PATH" ]; then
            echo "::error title=Play 업로드 불가::업로드 키(ANDROID_KEYSTORE_BASE64 등)가 없어 디버그 키로 서명됐어요. Play에는 올릴 수 없어요."
            exit 1
          fi
          ver=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "release_name=$ver (${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: Play Console 업로드 (초안)
        if: ${{ inputs.play_track != 'none' }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ohsang.util.onehouse.${{ inputs.app }}
          releaseFiles: apps/${{ inputs.app }}/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: draft
          releaseName: ${{ steps.play.outputs.release_name }}

      - name: Play 업로드 안내
        if: ${{ inputs.play_track != 'none' }}
        run: echo "::notice title=Play 업로드 완료::${{ inputs.play_track }} 트랙에 초안으로 올렸어요. Play Console → 테스트 → 해당 트랙에서 출시 노트 확인 후 '검토를 위해 전송'을 눌러 주세요."

      # 휴대폰에 바로 설치해서 확인하는 용도 (Play에는 위 AAB를 올린다)
      - name: 설치용 APK 빌드
        run: |
          defines=()
          [ -n "$ADMOB_BANNER_ANDROID" ] && defines+=("--dart-define=ADMOB_BANNER_ANDROID=$ADMOB_BANNER_ANDROID")
          flutter build apk --release --build-number=${{ github.run_number }} "${defines[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk "build/onehouse-${{ inputs.app }}-${{ github.run_number }}.apk"
          echo "::notice title=설치용 APK::Artifacts의 ${{ inputs.app }}-apk를 내려받아 압축을 풀고 휴대폰에서 설치하세요"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.app }}-apk
          path: apps/${{ inputs.app }}/build/onehouse-${{ inputs.app }}-${{ github.run_number }}.apk
          if-no-files-found: error
