name: memo
description: "한지붕 메모 - 함께 쓰는 공유 메모장"
publish_to: "none"
# 빌드 번호(+뒤)는 출시 워크플로가 실행 번호로 바꾼다
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  # 하단 배너 광고 (한지붕 가계부와 같은 방식, lib/widgets/ad_banner.dart)
  google_mobile_ads: ^8.0.0
  onehouse_core:
    path: ../../packages/onehouse_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

# 앱 아이콘 (scripts/flutter_platforms.sh가 dart run flutter_launcher_icons로 만든다)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../store-assets/memo/out/icon-1024.png"
  adaptive_icon_background: "../../store-assets/memo/out/android-adaptive-background.png"
  adaptive_icon_foreground: "../../store-assets/memo/out/android-adaptive-foreground.png"
  remove_alpha_ios: true
