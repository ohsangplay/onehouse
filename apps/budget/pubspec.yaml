name: budget
description: "한지붕 가계부 - 함께 쓰는 공유 가계부"
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 초대 링크(onehouse-budget://join?code=…)로 앱이 열렸을 때 받기
  # 7.x: iOS UIScene 앱에서도 꺼져 있다가 링크로 켜질 때 링크를 받는다
  app_links: ^7.2.2
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  google_mobile_ads: ^8.0.0
  http: ^1.2.2
  onehouse_core:
    path: ../../packages/onehouse_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

# 앱 아이콘 (scripts/flutter_platforms.sh가 dart run flutter_launcher_icons로 만든다)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../store-assets/budget/out/icon-1024.png"
  adaptive_icon_background: "../../store-assets/budget/out/android-adaptive-background.png"
  adaptive_icon_foreground: "../../store-assets/budget/out/android-adaptive-foreground.png"
  remove_alpha_ios: true
