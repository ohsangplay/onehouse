name = "onehouse-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
# 이전 앱 빌드·스토어 문서가 쓰던 주소라 당분간 켜둔다
workers_dev = true

# 운영 주소: api.ohsangplay.com 아래 경로 (DNS: api AAAA 100:: 프록시 켬)
#   /onehouse/budget/*  한지붕 가계부,  /onehouse/memo/*  한지붕 메모
# 서버가 접두 경로를 떼고 처리한다 (src/index.ts stripBasePath)
routes = [
  { pattern = "api.ohsangplay.com/onehouse", zone_name = "ohsangplay.com" },
  { pattern = "api.ohsangplay.com/onehouse/*", zone_name = "ohsangplay.com" },
]

# 서버 코드를 사용자 가까이가 아니라 DB(D1) 가까이에서 실행한다.
# 요청 하나에 DB를 여러 번 오가서, DB가 먼 지역에 있으면 왕복이 쌓여 느려진다 (한국 → DB 지역 왕복을 한 번으로 줄임)
[placement]
mode = "smart"

# 하루 한 번 (한국 시간 새벽 4시): 지운 지 30일 지난 데이터 완전 삭제 (src/lib/purge.ts)
[triggers]
crons = ["0 19 * * *"]

[vars]
# 스토어에 올라가면 주소를 넣고 다시 배포하세요. 비어 있으면 안내 페이지에 "출시 준비 중"으로 보여요.
# 한지붕 가계부
APP_STORE_URL = ""
PLAY_STORE_URL = ""
# 한지붕 메모
MEMO_APP_STORE_URL = ""
MEMO_PLAY_STORE_URL = ""
# ALLOW_WEB_ORIGINS 는 운영에서 설정하지 않습니다 (웹에서 API 사용 차단).

[[d1_databases]]
binding = "DB"
database_name = "onehouse"
# 배포 워크플로(.github/workflows/deploy.yml)가 계정의 onehouse DB를 찾아 실제 ID로 바꿔서 배포해요.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
